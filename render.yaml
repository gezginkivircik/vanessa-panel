# Render.com Blueprint: web servisi + yönetilen PostgreSQL (Frankfurt bölgesi).
services:
  - type: web
    name: vanessa-panel
    runtime: docker
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: VANESSA_ENV
        value: production
      - key: VANESSA_TRUST_PROXY
        value: "1"
      - key: VANESSA_SECRET_KEY
        generateValue: true
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: vanessa-db
          property: connectionString
databases:
  - name: vanessa-db
    region: frankfurt
    postgresMajorVersion: "16"
