{% macro wordmark(logo_path, href='/') -%}
<a class="wordmark" href="{{ href }}" aria-label="Vanessa Güzellik Merkezi">
  {%- if logo_path -%}
    <img class="brand-logo" src="{{ url_for('static', filename=logo_path) }}" alt="Vanessa Güzellik Merkezi">
  {%- else -%}
    <span class="wordmark__name">VANESSA</span><span class="wordmark__sub">GÜZELLİK MERKEZİ</span>
  {%- endif -%}
</a>
{%- endmacro %}
